name: Android APK Build & GitHub Release

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle Wrapper execute permission
        if: hashFiles('gradlew') != ''
        run: chmod +x gradlew

      - name: Build Ready-to-Install Android APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/hisabati-v1.0-android.apk
          sha256sum dist/hisabati-v1.0-android.apk > dist/SHA256SUMS.txt

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisabati-android-apk
          path: |
            dist/hisabati-v1.0-android.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (on tag push or manual run)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "حساباتي | HISABATI ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          body: |
            ### حزمة تثبيت تطبيق حساباتي لأجهزة Android
            - **المطور:** عمل انما سوفت | `772317950`
            - قم بتنزيل ملف `hisabati-v1.0-android.apk` وتثبيته مباشرة على هاتفك.
          files: |
            dist/hisabati-v1.0-android.apk
            dist/SHA256SUMS.txt
