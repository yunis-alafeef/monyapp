name: Verify & Deploy HISABATI PWA

on:
  push:
    branches:
      - main
      - master
      - fixes-v1
    paths:
      - "web/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

jobs:
  verify-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PWA tests & syntax
        run: |
          node --check web/public/sw.js
          node --check web/public/js/app.js
          node --test web/tests/pwa.test.mjs

  deploy-pages:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-pwa
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
